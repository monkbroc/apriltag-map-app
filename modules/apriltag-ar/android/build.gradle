plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.apriltagar'
version = '0.1.0'

android {
  namespace "expo.modules.apriltagar"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    externalNativeBuild {
      cmake {
        cFlags "-O3", "-w"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.ar:core:1.57.0'
}
